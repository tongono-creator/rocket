name: Root schedule-only image move
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'audit GET only; apply requires exact signed unpublished-photo schedule plan'
        type: choice
        options: [audit, apply, reconcile]
        default: audit
      plan:
        description: 'Root-signed schedule-only plan under design_revision/plans'
        type: string
        required: true
concurrency:
  group: content-studio-facebook
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  move-reviewed-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.32,<3' 'cryptography>=46,<47'
      - name: Offline reschedule and selected-affiliate tests
        run: PYTHONPATH=design_revision python -m unittest discover -s design_revision/reschedule_tests
      - name: Configure durable state commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
      - name: Root-signed exact same-ID schedule action
        env:
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          MOVE_MODE: ${{ inputs.mode }}
          MOVE_PLAN: ${{ inputs.plan }}
        run: |
          args=(--root . --channel rocket_fb --plan "$MOVE_PLAN" --mode "$MOVE_MODE")
          if [ "$MOVE_MODE" != audit ]; then args+=(--git-state); fi
          python design_revision/facebook_post_reschedule.py "${args[@]}" > reschedule_revision_result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reschedule-revision-result
          path: |
            reschedule_revision_result.json
            design_revision/reschedule_ledger.json
          retention-days: 30
